name: Single File All-in-One Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # ম্যানুয়ালি গিটহাব থেকেও রান করাতে পারবেন

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # ১. গিটহাব থেকে রিপোজিটরি নামিয়ে নেওয়া
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ২. জাভা (JDK 17) সেটআপ করা
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ৩. গ্রেডল ক্যাশ কনফিগার করা
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    # ৪. একক ফাইলে বা প্রজেক্টে প্রয়োজনীয় ফোল্ডার ও কোড স্ট্রাকচার ভেরিফাই বা তৈরি করা
    - name: Prepare Project Structure
      run: |
        echo "Checking project files..."
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper not found, generating..."
          gradle wrapper
        fi
        chmod +x gradlew

    # ৫. সরাসরি Gradle দিয়ে প্রজেক্ট কম্পাইল করে Debug APK তৈরি করা
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # ৬. তৈরি হওয়া APK ফাইলটি GitHub Artifact হিসেবে সেভ করে রাখা (যাতে ডাউনলোড করা যায়)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FloatingFish-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
