name: Auto Build Floating Fish APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # ১. গিটহাবের ভেতরেই স্বয়ংক্রিয়ভাবে পুরো অ্যান্ড্রয়েড প্রজেক্ট স্ট্রাকচার ও ফাইল তৈরি করা
    - name: Generate Android Project Files
      run: |
        mkdir -p app/src/main/java/com/example/aianimation
        mkdir -p app/src/main/res/values

        # 1. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.aianimation">

            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/star_on"
                android:label="Floating Fish"
                android:roundIcon="@android:drawable/star_on"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                
                <service
                    android:name=".FloatingFishService"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

        # 2. FloatingFishService.kt (ড্রাগ করার সুবিধাসহ সম্পূর্ণ কোড)
        cat << 'EOF' > app/src/main/java/com/example/aianimation/FloatingFishService.kt
        package com.example.aianimation

        import android.app.Service
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.Build
        import android.os.IBinder
        import android.view.Gravity
        import android.view.MotionEvent
        import android.view.View
        import android.view.WindowManager
        import android.widget.ImageView

        class FloatingFishService : Service() {
            private lateinit var windowManager: WindowManager
            private lateinit var fishView: ImageView
            private lateinit var layoutParams: WindowManager.LayoutParams
            private var initialX = 0
            private var initialY = 0
            private var initialTouchX = 0f
            private var initialTouchY = 0f

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                fishView = ImageView(this).apply {
                    setImageResource(android.R.drawable.star_on)
                    scaleType = ImageView.ScaleType.FIT_CENTER
                }

                val LAYOUT_FLAG = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                } else {
                    WindowManager.LayoutParams.TYPE_PHONE
                }

                layoutParams = WindowManager.LayoutParams(
                    150, 150,
                    LAYOUT_FLAG,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.TOP or Gravity.START
                    x = 100
                    y = 200
                }

                fishView.setOnTouchListener { _, event ->
                    when (event.action) {
                        MotionEvent.ACTION_DOWN -> {
                            initialX = layoutParams.x
                            initialY = layoutParams.y
                            initialTouchX = event.rawX
                            initialTouchY = event.rawY
                            true
                        }
                        MotionEvent.ACTION_MOVE -> {
                            layoutParams.x = initialX + (event.rawX - initialTouchX).toInt()
                            layoutParams.y = initialY + (event.rawY - initialTouchY).toInt()
                            windowManager.updateViewLayout(fishView, layoutParams)
                            true
                        }
                        else -> false
                    }
                }

                windowManager.addView(fishView, layoutParams)
            }

            override fun onDestroy() {
                super.onDestroy()
                if (::fishView.isInitialized) {
                    windowManager.removeView(fishView)
                }
            }
        }
        EOF

        # 3. build.gradle (Module: app)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.aianimation'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.aianimation"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. build.gradle (Project level)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 5. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AI Animation"
        include ':app'
        EOF

        # 6. gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # Gradle Wrapper জেনারেট করা
        gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FloatingFish-APK
        path: app/build/outputs/apk/debug/app-debug.apk
