name: Build Android App (APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ১. রিপোজিটরি কোড ক্লাউডে নামানো
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ২. Java (JDK 17) সেটআপ করা (আধুনিক অ্যান্ড্রয়েড প্রজেক্টের জন্য JDK 17 প্রয়োজন)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ৩. Gradle ক্যাশ এনাবল করা যাতে পরবর্তী বিল্ড দ্রুত হয়
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    # ৪. gradlew ফাইলে এক্সিকিউট পারমিশন দেওয়া (Linux এনভায়রনমেন্টের জন্য জরুরি)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ৫. Gradle ব্যবহার করে Debug APK তৈরি করা
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # ৬. তৈরি হওয়া APK ফাইলটি GitHub Artifact হিসেবে সেভ করে রাখা
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
